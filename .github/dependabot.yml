version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/cardboard-slicer"
      - "/apps/folding-boxes"
      - "/apps/lead-scanner"
      - "/apps/voronoi-shapes"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
